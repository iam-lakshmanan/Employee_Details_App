
name: DEV Docker Deployment

on:
  push:
    branches:
      - dev

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v5

      # Step 2: Copy source code to DEV Server
      - name: Copy Files to DEV Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/Employee_Details_App"
          rm: false
          strip_components: 0

      # Step 3: Build and Deploy Docker Containers
      - name: Build and Deploy Using Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            cd /home/ubuntu/Employee_Details_App

            echo "Building Docker images..."

            docker compose build

            echo "Starting Docker containers..."

            docker compose up -d --remove-orphans

            echo "Removing unused Docker images..."

            docker image prune -f

            echo "Checking container status..."

            docker compose ps

            echo "DEV deployment completed successfully!"
